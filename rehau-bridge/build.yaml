---
# Use the standard "base" images that already include bashio. Base 21.x is
# Alpine 3.24, whose `nodejs` package is Node 24 LTS (our tsup target).
# Base 19+ no longer ships 32-bit images, so armv7 was dropped in 6.2.0.
build_from:
  aarch64: ghcr.io/hassio-addons/base:21.0.10
  amd64: ghcr.io/hassio-addons/base:21.0.10
